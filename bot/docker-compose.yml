# docker-compose.yml — local dev for LuminaBot.
# Usage:
#   cp .env.example .env  (and fill in real values)
#   docker compose up -d
#   docker compose logs -f lumina-bot
version: "3.9"
services:
  lumina-bot:
    build: .
    container_name: lumina-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
