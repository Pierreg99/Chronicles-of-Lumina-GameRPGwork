name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          # Pull the section matching the version from CHANGELOG.md
          FILE="chronicles-of-lumina/CHANGELOG.md"
          if [ ! -f "$FILE" ]; then
            echo "body=Release ${{ steps.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract from ## [x.y.z] until the next ## heading
          BODY=$(awk -v ver="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && $0 ~ /^## / {exit}
            found {print}
          ' "$FILE")

          if [ -z "$BODY" ]; then
            BODY="Release ${{ steps.version.outputs.tag }} — see CHANGELOG.md for details."
          fi

          # Multiline output for GITHUB_OUTPUT
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Chronicles of Lumina ${{ steps.version.outputs.tag }}
          body: |
            ## Chronicles of Lumina ${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.body }}

            ---
            **Live Demo:** https://pierreg99.github.io/Chronicles-of-Lumina-GameRPGwork/
            **Changelog:** https://github.com/Pierreg99/Chronicles-of-Lumina-GameRPGwork/blob/main/chronicles-of-lumina/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
