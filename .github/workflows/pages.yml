# pages.yml — modern GitHub Pages deploy via actions/deploy-pages & gh-pages branch fallback
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Build site
        working-directory: chronicles-of-lumina
        run: npm run build-pages

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          # Copy game assets, skip non-web folders
          rsync -a \
            --exclude 'node_modules' \
            --exclude 'bot' \
            --exclude 'desktop' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude 'package*.json' \
            --exclude 'jsconfig.json' \
            --exclude 'build-pages.mjs' \
            --exclude '.gitignore' \
            chronicles-of-lumina/ _site/
          # Keep PWA manifest
          if [ -f chronicles-of-lumina/manifest.webmanifest ]; then
            cp chronicles-of-lumina/manifest.webmanifest _site/
          fi
          # Ensure .nojekyll so underscore paths are served
          touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d16ff0b8d1c5cde0a9767c8 # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ec41091b5d8c6a9fcfcc669a0f91 # v4.0.5
