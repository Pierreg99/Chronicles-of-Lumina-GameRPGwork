# pages.yml — build game and push static output to gh-pages branch on every push.
# Uses peaceiris/actions-gh-pages with explicit exclude_assets to keep
# gh-pages lean (no bot/, desktop/, tests/, docs/, etc.)
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Build site
        working-directory: chronicles-of-lumina
        run: npm run build-pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4c82c7262fae7c69e985454e2c815482877cc12a # v3.9.3, SHA-pinned
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./chronicles-of-lumina
          destination_dir: ''
          allow_empty_commit: true
          exclude_assets: |
            node_modules/**
            bot/**
            desktop/**
            tests/**
            docs/**
            *.md
            *.json
            !manifest.webmanifest
            jsconfig.json
            package*.json
            build-pages.mjs
            .gitignore
            .nojekyll
