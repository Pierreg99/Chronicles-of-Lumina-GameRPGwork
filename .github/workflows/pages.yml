# pages.yml — build game and push static output to gh-pages branch on every push.
# Uses peaceiris/actions-gh-pages with explicit exclude_assets to keep
# gh-pages lean (no bot/, desktop/, tests/, docs/, etc.)
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Build site
        working-directory: chronicles-of-lumina
        run: npm run build-pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3, SHA-pinned
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./chronicles-of-lumina
          destination_dir: ''
          allow_empty_commit: true
          exclude_assets: |
            node_modules/**
            bot/**
            desktop/**
            tests/**
            docs/**
            *.md
            *.json
            !manifest.webmanifest
            jsconfig.json
            package*.json
            build-pages.mjs
            .gitignore
            .nojekyll
