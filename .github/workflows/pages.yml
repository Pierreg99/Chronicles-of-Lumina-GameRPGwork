# pages.yml — modern GitHub Pages deploy via actions/deploy-pages
# After first successful run, set Settings → Pages → Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Build site
        working-directory: chronicles-of-lumina
        run: npm run build-pages

      - name: Prepare publish directory
        run: |
          mkdir -p _site/chronicles-of-lumina
          # Nested game entry (build-pages copied game.html → index.html)
          rsync -a \
            --exclude 'node_modules' \
            --exclude 'bot' \
            --exclude 'desktop' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude 'package*.json' \
            --exclude 'jsconfig.json' \
            --exclude 'build-pages.mjs' \
            --exclude '.gitignore' \
            chronicles-of-lumina/ _site/chronicles-of-lumina/
          # Root redirect → chronicles-of-lumina/game.html (preserves query/hash)
          cp index.html _site/index.html
          if [ -f .well-known/security.txt ]; then
            mkdir -p _site/.well-known
            cp .well-known/security.txt _site/.well-known/
          fi
          touch _site/.nojekyll


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
