# pages.yml — modern GitHub Pages deploy via actions/deploy-pages
# After first successful run, set Settings → Pages → Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Build site
        working-directory: chronicles-of-lumina
        run: npm run build-pages

      - name: Prepare publish directory
        run: |
          mkdir -p _site/chronicles-of-lumina
          # Nested game entry (build-pages copied game.html → index.html)
          rsync -a \
            --exclude 'node_modules' \
            --exclude 'bot' \
            --exclude 'desktop' \
            --exclude 'tests' \
            --exclude 'docs' \
            --exclude '*.md' \
            --exclude 'package*.json' \
            --exclude 'jsconfig.json' \
            --exclude 'build-pages.mjs' \
            --exclude '.gitignore' \
            chronicles-of-lumina/ _site/chronicles-of-lumina/
          # Root redirect → chronicles-of-lumina/game.html (preserves query/hash)
          cp index.html _site/index.html
          if [ -f .well-known/security.txt ]; then
            mkdir -p _site/.well-known
            cp .well-known/security.txt _site/.well-known/
          fi
          touch _site/.nojekyll


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
