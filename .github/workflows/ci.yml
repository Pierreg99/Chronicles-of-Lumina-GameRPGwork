# ci.yml — run unit tests on every push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: chronicles-of-lumina/package-lock.json

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Test
        working-directory: chronicles-of-lumina
        run: npm test

      - name: Syntax check (src)
        working-directory: chronicles-of-lumina
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
