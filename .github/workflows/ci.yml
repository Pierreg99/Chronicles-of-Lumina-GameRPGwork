# ci.yml — run unit tests on every push/PR to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: chronicles-of-lumina/package-lock.json

      - name: Install
        working-directory: chronicles-of-lumina
        run: npm ci

      - name: Test
        working-directory: chronicles-of-lumina
        run: npm test

      - name: Syntax check (src)
        working-directory: chronicles-of-lumina
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
