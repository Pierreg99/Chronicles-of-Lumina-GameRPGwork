name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2, pinned per org policy

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0, pinned per org policy
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install
      working-directory: chronicles-of-lumina
      run: npm install

    - name: Test
      working-directory: chronicles-of-lumina
      run: npm test
