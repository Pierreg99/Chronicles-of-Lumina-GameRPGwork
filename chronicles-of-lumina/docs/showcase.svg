<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background: gradient sky → forest -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1d4d8a"/>
      <stop offset="60%" stop-color="#3a6db0"/>
      <stop offset="100%" stop-color="#7a9fd0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#4ea43a"/>
      <stop offset="100%" stop-color="#2d6e21"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(180, 230, 255, 0.6)"/>
      <stop offset="100%" stop-color="rgba(180, 230, 255, 0)"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <rect y="320" width="1200" height="160" fill="url(#ground)"/>

  <!-- Distant mountain silhouette -->
  <polygon points="0,320 200,180 380,260 540,160 720,240 880,170 1020,250 1200,200 1200,320" fill="#2a4d6e" opacity="0.6"/>

  <!-- Glow behind crystal -->
  <circle cx="600" cy="200" r="120" fill="url(#glow)"/>

  <!-- Central crystal (diamond) -->
  <g transform="translate(600,200)">
    <polygon points="0,-80 60,0 0,80 -60,0" fill="#5fb3ff" stroke="#0a1d3a" stroke-width="3"/>
    <polygon points="0,-80 60,0 0,0"  fill="rgba(255,255,255,0.4)"/>
    <polygon points="0,80 60,0 0,0"   fill="rgba(0,30,80,0.4)"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#0a1d3a" stroke-width="2"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#0a1d3a" stroke-width="2"/>
  </g>

  <!-- Slime (blue, left) -->
  <g transform="translate(280,360)">
    <ellipse cx="0" cy="0" rx="48" ry="42" fill="#5fb3ff" stroke="#0a2410" stroke-width="3"/>
    <ellipse cx="-15" cy="-12" rx="22" ry="14" fill="rgba(180,225,255,0.6)"/>
    <!-- eyes -->
    <ellipse cx="-10" cy="-5" rx="5" ry="6" fill="#fff"/>
    <ellipse cx="10"  cy="-5" rx="5" ry="6" fill="#fff"/>
    <circle cx="-10" cy="-5" r="3" fill="#0a2410"/>
    <circle cx="10"  cy="-5" r="3" fill="#0a2410"/>
    <circle cx="-9" cy="-6" r="1" fill="#fff"/>
    <circle cx="11" cy="-6" r="1" fill="#fff"/>
    <!-- mouth -->
    <path d="M-8,8 Q0,14 8,8" stroke="#0a2410" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Slime (green, right) -->
  <g transform="translate(920,360)">
    <ellipse cx="0" cy="0" rx="48" ry="42" fill="#7fc95a" stroke="#1d4a18" stroke-width="3"/>
    <ellipse cx="-15" cy="-12" rx="22" ry="14" fill="rgba(200,255,180,0.6)"/>
    <ellipse cx="-10" cy="-5" rx="5" ry="6" fill="#fff"/>
    <ellipse cx="10"  cy="-5" rx="5" ry="6" fill="#fff"/>
    <circle cx="-10" cy="-5" r="3" fill="#1d4a18"/>
    <circle cx="10"  cy="-5" r="3" fill="#1d4a18"/>
    <path d="M-8,8 Q0,14 8,8" stroke="#1d4a18" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- leaves on top -->
    <ellipse cx="-8" cy="-42" rx="6" ry="3" fill="#4ea43a" stroke="#1d4a18" stroke-width="1.5" transform="rotate(-30,-8,-42)"/>
    <ellipse cx="8"  cy="-42" rx="6" ry="3" fill="#4ea43a" stroke="#1d4a18" stroke-width="1.5" transform="rotate(30,8,-42)"/>
  </g>

  <!-- Tree (left) -->
  <g transform="translate(140,360)">
    <rect x="-8" y="0" width="16" height="40" fill="#6e4a2a" stroke="#2a1a0e" stroke-width="2"/>
    <circle cx="0" cy="-10" r="36" fill="#4ea43a" stroke="#1d4a18" stroke-width="2"/>
    <circle cx="-12" cy="-22" r="20" fill="#7fc95a"/>
  </g>

  <!-- Tree (right) -->
  <g transform="translate(1060,360)">
    <rect x="-8" y="0" width="16" height="40" fill="#6e4a2a" stroke="#2a1a0e" stroke-width="2"/>
    <circle cx="0" cy="-10" r="36" fill="#4ea43a" stroke="#1d4a18" stroke-width="2"/>
    <circle cx="12" cy="-22" r="20" fill="#7fc95a"/>
  </g>

  <!-- Hearts (HUD, top-right) -->
  <g transform="translate(1080,40)">
    <path d="M0,0 C-8,-8 -20,-4 -20,8 C-20,16 -8,24 0,32 C8,24 20,16 20,8 C20,-4 8,-8 0,0 Z" fill="#e74c3c" stroke="#3a0a08" stroke-width="2"/>
  </g>
  <g transform="translate(1110,40)">
    <path d="M0,0 C-8,-8 -20,-4 -20,8 C-20,16 -8,24 0,32 C8,24 20,16 20,8 C20,-4 8,-8 0,0 Z" fill="#e74c3c" stroke="#3a0a08" stroke-width="2"/>
  </g>
  <g transform="translate(1140,40)">
    <path d="M0,0 C-8,-8 -20,-4 -20,8 C-20,16 -8,24 0,32 C8,24 20,16 20,8 C20,-4 8,-8 0,0 Z" fill="#7a4a4a" stroke="#3a0a08" stroke-width="2"/>
  </g>

  <!-- Title (top-left) -->
  <text x="60" y="120" font-size="72" font-weight="900" fill="#fff" stroke="#0e0a14" stroke-width="3" paint-order="stroke">Chronicles of</text>
  <text x="60" y="195" font-size="96" font-weight="900" fill="#f5d04a" stroke="#0e0a14" stroke-width="3" paint-order="stroke">Lumina</text>
  <text x="60" y="240" font-size="20" font-weight="500" fill="#fff" opacity="0.9">A 3D browser JRPG · Vanilla JS + Three.js</text>

  <!-- Play button + version badge (bottom) -->
  <g transform="translate(60,400)">
    <rect width="220" height="50" rx="8" fill="#caa14a" stroke="#3a1f0a" stroke-width="2"/>
    <text x="110" y="33" text-anchor="middle" font-size="20" font-weight="700" fill="#3a1f0a">▶  Play the Demo</text>
  </g>
  <g transform="translate(300,400)">
    <rect width="120" height="50" rx="8" fill="#1d4d8a" stroke="#0e0a14" stroke-width="2"/>
    <text x="60" y="33" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">v0.10.3</text>
  </g>
  <g transform="translate(440,400)">
    <rect width="200" height="50" rx="8" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="100" y="33" text-anchor="middle" font-size="18" font-weight="600" fill="#fff">github.com/Pierreg99/</text>
  </g>
  <g transform="translate(440,425)">
    <text x="0" y="20" font-size="18" font-weight="600" fill="#fff">Lumina-Game</text>
  </g>

  <!-- Sparkles -->
  <g fill="#fff">
    <circle cx="450" cy="160" r="2"/>
    <circle cx="780" cy="120" r="2.5"/>
    <circle cx="380" cy="240" r="1.8"/>
    <circle cx="820" cy="200" r="2"/>
  </g>
</svg>
